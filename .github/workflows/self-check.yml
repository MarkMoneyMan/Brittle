name: self-check

# Dogfoods action.yml against this repo itself, on every push/PR. Six
# jobs, all really assertions about the tool's own correctness (not about
# this repo's code health): one path is known to contain real Anthropic-
# rule findings and must fail the severity gate, one specifically checks
# the OpenAI (Python) rules by name (not just "some rule fired" — see that
# job's comment for why), one path is known to be clean and must pass the
# gate, one installs the pip package (pyproject.toml) fresh and checks the
# installed console scripts behave the same as running the scripts
# directly, one is a permanent regression test for the string-literal
# false-positive gap closed on 2026-09-11 (see README's "Closing the
# string-literal gap in generic_scan() itself"), and one checks the OpenAI
# JS/TS rule by name AND is the first CI-covered proof scan-js: "true"
# works at all. If any assumption stops holding, that's a regression to
# fix, not a real finding to triage.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  expect-findings-on-example-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run claude-api-guard against example_project/ (known to have findings)
        id: scan
        uses: ./
        continue-on-error: true
        with:
          path: example_project/
          fail-on: HIGH
      - name: Assert the severity gate actually failed
        run: |
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::Expected the HIGH-severity gate to fail against example_project/ (it has known HIGH findings), but the step outcome was '${{ steps.scan.outcome }}'."
            exit 1
          fi
          echo "OK: gate correctly failed (${{ steps.scan.outputs.findings-count }} finding(s))."

  expect-openai-rules-fire-on-openai-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run claude-api-guard against example_project/openai_bot.py (known OpenAI-rule findings)
        id: scan
        continue-on-error: true
        uses: ./
        with:
          path: example_project/openai_bot.py
          fail-on: HIGH
      - name: Assert the severity gate failed AND both known OpenAI rules actually fired
        run: |
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::Expected the HIGH-severity gate to fail against example_project/openai_bot.py (it has known HIGH findings), but the step outcome was '${{ steps.scan.outcome }}'."
            exit 1
          fi
          json_path="${{ steps.scan.outputs.findings-json }}"
          for rule_id in openai-httpx-to-httpx2 openai-v1-legacy-module-level-calls-removed; do
            if ! grep -q "\"$rule_id\"" "$json_path"; then
              echo "::error::Expected rule_id '$rule_id' in $json_path but it wasn't there. A generic assertion (findings-count > 0, checked in the other job) can't catch this: if this exact rule silently stopped firing but some OTHER rule in the merged RULES list still matched something in this file, the gate would still fail and this regression would go unnoticed. That's specifically why this job greps for each expected rule_id by name instead of just checking the gate failed."
              exit 1
            fi
          done
          echo "OK: gate correctly failed, and both openai-httpx-to-httpx2 and openai-v1-legacy-module-level-calls-removed fired as expected."

  expect-clean-on-known-clean-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run claude-api-guard against ci_fixtures/known_clean.py (should be clean)
        id: scan
        uses: ./
        with:
          path: ci_fixtures/known_clean.py
          fail-on: HIGH
      - name: Assert no findings
        run: |
          if [ "${{ steps.scan.outputs.findings-count }}" != "0" ]; then
            echo "::error::Expected 0 findings on ci_fixtures/known_clean.py, got ${{ steps.scan.outputs.findings-count }}. See that file's docstring for why it exists — it must stay free of every rule's trigger strings."
            exit 1
          fi
          echo "OK: 0 findings on the known-clean fixture, as expected."

  expect-no-string-literal-false-positives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run against fixture 1 (no real SDK usage, every trigger string is unrelated log text)
        id: scan1
        uses: ./
        with:
          path: pipeline_runs/string_literal_audit_fixture.py
          fail-on: HIGH
      - name: Assert zero findings on fixture 1
        run: |
          if [ "${{ steps.scan1.outputs.findings-count }}" != "0" ]; then
            echo "::error::Expected 0 findings on string_literal_audit_fixture.py, got ${{ steps.scan1.outputs.findings-count }}. This fixture plants 7 rules' trigger text purely inside unrelated logger.info(...) strings — any finding here means the string-literal masking fix in generic_scan() (_mask_string_literals in ast_scan.py) has regressed. See README's 'Closing the string-literal gap' section."
            exit 1
          fi
          echo "OK: 0 findings on fixture 1, as expected."
      - name: Run against fixture 2 (real anthropic/openai SDK usage alongside unrelated log strings)
        id: scan2
        uses: ./
        with:
          path: pipeline_runs/string_literal_audit_fixture2.py
          fail-on: HIGH
      - name: Assert only the 3 deliberately-exempted rules fired, and none of the fixed ones came back
        run: |
          # Fixture 2 legitimately references anthropic/openai for real, so it
          # exercises the harder case: rules gated by "this file references
          # anthropic/openai" (GENERIC_EXTRA_CONDITIONS) don't get protected by
          # that gate alone here, only by the string masking. Exactly 3
          # findings are expected: the 3 rules in GENERIC_RULES_MATCH_INSIDE_STRINGS
          # that are deliberately still allowed to match inside string
          # contents (documented residual false-positive risk, not a bug).
          if [ "${{ steps.scan2.outputs.findings-count }}" != "3" ]; then
            echo "::error::Expected exactly 3 findings on string_literal_audit_fixture2.py (the 3 deliberately-exempted rules), got ${{ steps.scan2.outputs.findings-count }}."
            exit 1
          fi
          json_path="${{ steps.scan2.outputs.findings-json }}"
          for rule_id in python-sdk-v1-min-python-version memory-list-managed-agents-header-behavior-change computer-use-toolset-new-shape; do
            if ! grep -q "\"$rule_id\"" "$json_path"; then
              echo "::error::Expected exempted rule_id '$rule_id' to fire on string_literal_audit_fixture2.py but it wasn't there — check GENERIC_RULES_MATCH_INSIDE_STRINGS in ast_scan.py."
              exit 1
            fi
          done
          # The actual regression check: these rule_ids were false-firing on
          # string-literal content before the fix and must never appear here.
          for rule_id in beta-files-skills-sdk-shape-change python-sdk-v1-bedrock-no-default-region python-sdk-v1-compaction-control-removed python-sdk-v1-httpx-to-httpx2 openai-httpx-to-httpx2 openai-v2-tool-call-output-type-widened openai-v1-error-classes-renamed python-sdk-v1-async-with-raw-response openai-v1-legacy-module-level-calls-removed; do
            if grep -q "\"$rule_id\"" "$json_path"; then
              echo "::error::rule_id '$rule_id' fired on string_literal_audit_fixture2.py, matching only unrelated log text. This is exactly the string-literal false-positive bug class fixed on 2026-09-11 — it has regressed."
              exit 1
            fi
          done
          echo "OK: exactly the 3 exempted rules fired, and none of the 9 previously-fixed rules matched string-literal content."

  expect-openai-js-rule-fires-on-js-fixture:
    # Also the first CI-covered proof that inputs.scan-js: "true" actually
    # works end-to-end in a real Actions run at all (action.yml's JS/TS
    # path — Node setup, npm install, ast_scan.js — was previously only
    # ever exercised manually/locally; see README's "JS/TS support").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run claude-api-guard (with scan-js) against js_scanner/example_project/ (known findings, both providers)
        id: scan
        continue-on-error: true
        uses: ./
        with:
          path: js_scanner/example_project
          scan-js: "true"
          fail-on: HIGH
      - name: Assert the severity gate failed AND the OpenAI JS/TS rule actually fired
        run: |
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::Expected the HIGH-severity gate to fail against js_scanner/example_project/ (bot.ts has known HIGH findings), but the step outcome was '${{ steps.scan.outcome }}'."
            exit 1
          fi
          json_path="${{ steps.scan.outputs.findings-json }}"
          if ! grep -q "\"openai-v2-tool-call-output-type-widened\"" "$json_path"; then
            echo "::error::Expected rule_id 'openai-v2-tool-call-output-type-widened' in $json_path (openai_bot.ts's real type import at line 7) but it wasn't there — check rules_js.js's OpenAI block and that scan-js: \"true\" actually ran the JS/TS scanner."
            exit 1
          fi
          echo "OK: gate correctly failed, and the OpenAI JS/TS rule fired on openai_bot.ts as expected."

  package-installs-and-runs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install claude-api-guard from this checkout (pyproject.toml)
        run: pip install .
      - name: Run the installed claude-api-guard-scan against example_project/
        id: scan
        continue-on-error: true
        run: claude-api-guard-scan example_project/ --json installed_scan_findings.json
      - name: Assert it found the known HIGH findings from BOTH providers (nonzero exit, not a crash)
        run: |
          # Real bug, found on a real Actions run (not hypothetical): this
          # assertion used to check only `outcome == "failure"`, and a
          # ModuleNotFoundError (rules_openai missing from the installed
          # package — see pyproject.toml's history) ALSO exits non-zero,
          # so that crash silently passed this exact check while genuinely
          # meaning something completely different from "found the known
          # findings." Now checks that a real findings-json file exists
          # and contains specific rule_ids from BOTH rules files — proof
          # the installed package's full merged RULES list actually
          # loaded, not just proof *some* command somewhere exited 1.
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::Expected the installed claude-api-guard-scan to exit non-zero against example_project/ (it has known findings), but the step outcome was '${{ steps.scan.outcome }}'."
            exit 1
          fi
          if [ ! -s installed_scan_findings.json ]; then
            echo "::error::Expected installed_scan_findings.json to exist and be non-empty — the scan step exited non-zero, but if that's a crash (e.g. an import error) rather than real findings, no JSON file gets written at all."
            exit 1
          fi
          for rule_id in sdk-v1-sampling-params-removed openai-httpx-to-httpx2; do
            if ! grep -q "\"$rule_id\"" installed_scan_findings.json; then
              echo "::error::Expected rule_id '$rule_id' in installed_scan_findings.json but it wasn't there — the installed package's merged RULES list (rules.py + rules_openai.py) may not have loaded correctly."
              exit 1
            fi
          done
          echo "OK: installed console script found and reported the known findings from both providers."
      - name: Assert the installed claude-api-guard-autofix produces a working patch
        run: |
          cp example_project/autofix_test.py /tmp/autofix_smoke_test.py
          claude-api-guard-autofix /tmp/autofix_smoke_test.py --write
          if diff -q example_project/autofix_test.py /tmp/autofix_smoke_test.py > /dev/null; then
            echo "::error::Expected claude-api-guard-autofix to change /tmp/autofix_smoke_test.py, but it made no edits."
            exit 1
          fi
          python3 -c "import ast; ast.parse(open('/tmp/autofix_smoke_test.py').read())"
          echo "OK: installed autofix console script produced a patch that still parses."
