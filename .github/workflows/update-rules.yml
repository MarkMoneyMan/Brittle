# Closes the "self-maintaining" loop: runs sync_rules.py on a schedule (and
# on-demand via workflow_dispatch), once per provider (Anthropic, then
# OpenAI, then Gemini — see PROVIDERS in sync_rules.py), which fetches each
# provider's live changelog, extracts any new breaking-change rules via the
# model, and appends them to that provider's rules file (rules.py /
# rules_openai.py / rules_gemini.py). Opens ONE PR covering whatever
# actually changed across all three — same peter-evans/create-pull-request
# pattern as autofix-weekly.yml, which already no-ops cleanly when there's
# nothing to do. All three providers share one PR (rather than one each)
# because they share one fixed branch and one pipeline_runs/
# last_synced.json — simpler to review as a single "what's new this week
# across every provider we track" diff than to manage three competing
# branches.
#
# Gemini's sync will, on its first real run, also pick up the Interactions-
# API-only breaking changes rules_gemini.py's hand-seeded pass deliberately
# left out (see that file's docstring) — that's intended, not a bug: this
# is exactly the "narrower surface, not yet tested" material meant to go
# through the more cautious extract-then-human-review PR path instead of
# being hand-shipped speculatively.
#
# Uses a fixed branch name so a run before last week's PR is merged updates
# that PR instead of opening a duplicate.
#
# Needs a repo secret: ANTHROPIC_API_KEY (Settings -> Secrets and
# variables -> Actions) — used to call the model that does the extraction
# for ALL THREE providers. No OpenAI or Google API key is needed for any of
# this: syncing the OpenAI/Gemini providers only ever reads their public
# changelog pages, never calls their own APIs. Without ANTHROPIC_API_KEY,
# this job fails loudly rather than silently skipping — see sync_rules.py's
# error message.

name: brittle rule sync

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC — offset an hour from autofix-weekly's 06:00
  workflow_dispatch:

jobs:
  sync-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic

      - name: Sync rules from Anthropic's release notes
        id: sync-anthropic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 sync_rules.py --provider anthropic

      - name: Sync rules from OpenAI's changelog
        id: sync-openai
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 sync_rules.py --provider openai

      - name: Sync rules from Gemini's changelog
        id: sync-gemini
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 sync_rules.py --provider gemini

      - name: Sanity-check all three rules files still parse
        run: |
          python3 -c "import ast; ast.parse(open('rules.py').read())"
          python3 -c "import ast; ast.parse(open('rules_openai.py').read())"
          python3 -c "import ast; ast.parse(open('rules_gemini.py').read())"

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "brittle: sync rules from provider release notes"
          title: "brittle: new rules from provider release notes"
          body: >
            Auto-generated by brittle's weekly rule-sync job.
            Fetches Anthropic's release notes
            (https://platform.claude.com/docs/en/release-notes/overview.md),
            openai-python's CHANGELOG.md
            (https://github.com/openai/openai-python/blob/main/CHANGELOG.md,
            pre-filtered to sections explicitly marked "BREAKING CHANGES"),
            and python-genai's CHANGELOG.md
            (https://github.com/googleapis/python-genai/blob/main/CHANGELOG.md,
            same pre-filter, case-insensitive), extracts breaking-change
            rules from whatever's new since each provider's last sync, and
            appends them to that provider's rules file (rules.py /
            rules_openai.py / rules_gemini.py) — plus advances
            pipeline_runs/last_synced.json either way, so nothing gets
            re-processed next run. Review each new rule's pattern for false
            positives before merging, same as any hand-written rule — see
            README's "Multi-provider support" section for the kind of
            false positive that's actually shown up in testing so far.
          branch: brittle/rule-updates
          delete-branch: true
