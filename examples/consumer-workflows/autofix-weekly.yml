# TEMPLATE — periodic auto-fix PR for a downstream project.
#
# Updated 2026-09-12, simpler than it used to be: the repo used to be
# private, which meant `pip install` here needed a fine-grained PAT stored
# as a secret in the *downstream* repo (the default GITHUB_TOKEN a workflow
# gets is scoped only to the repo it's running in, so it couldn't reach a
# second private repo on its own). Now that the repo is public, none of
# that applies — `pip install git+https://github.com/MarkMoneyMan/brittle.git@master`
# below works with no credentials at all, same as installing any other
# public package.
#
# What it does: once a week (and on-demand via workflow_dispatch), applies
# the 5 mechanical auto-fixes from autofix.py and opens a PR if anything
# changed. Uses peter-evans/create-pull-request, a well-established action
# for exactly this "generate a patch, open a PR from it" shape — no custom
# PR-opening code needed, and it already no-ops cleanly when there's
# nothing to fix.
#
# Installs Brittle as a real package instead of checking out the tool's
# whole repo into a subfolder just to reach one file — see pyproject.toml
# and README's "Packaging" section for what that involved and its one
# stated tradeoff (flat top-level module names, not yet a brittle/
# namespace).

name: Brittle autofix

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Brittle from its public repo
        run: |
          pip install "git+https://github.com/MarkMoneyMan/brittle.git@master"

      - name: Apply mechanical auto-fixes
        run: brittle-autofix repo --write

      - uses: peter-evans/create-pull-request@v6
        with:
          path: repo
          commit-message: "brittle: apply mechanical Claude/OpenAI/Gemini API fixes"
          title: "brittle: mechanical Claude/OpenAI/Gemini API fixes"
          body: >
            Auto-generated by Brittle's weekly autofix job.
            Only covers the 5 rule ids with no judgment call attached
            (see autofix.py's module docstring) — review the diff, but
            these shouldn't need behavior decisions, just a merge.
          branch: brittle/autofix
          delete-branch: true
