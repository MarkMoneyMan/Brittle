# TEMPLATE — how a downstream project (e.g. OddsScanner) uses Brittle
# (renamed from claude-api-guard on 2026-09-12) now that it's published at
# github.com/MarkMoneyMan/brittle.
#
# Copy this into that project's own .github/workflows/.
#
# Note, corrected 2026-09-12: this file used to warn that the repo was
# private and describe the same-account/explicit-Access workarounds needed
# for a private repo's Action to be referenced from elsewhere. That's no
# longer true — the repo is public — so `uses: MarkMoneyMan/brittle@master`
# below works from any repo, same account or not, no extra Settings step
# needed.
#
# What it does: on every PR, flags Claude/OpenAI/Gemini API usage that's
# broken or about to break. Fails the check only on HIGH severity by
# default so a MEDIUM/LOW heads-up doesn't block merging.

name: Brittle check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: MarkMoneyMan/brittle@master
        with:
          path: .
          fail-on: HIGH
          # scan-js: "true"   # uncomment if this repo also has JS/TS Anthropic/OpenAI/Gemini SDK usage
